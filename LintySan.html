<script>
    // Как только пользователь кликнет в любом месте сайта...
    document.addEventListener('click', function() {
        var audio = document.getElementById('bg-music');
        
        // ...проверяем, не играет ли она уже, и запускаем
        if (audio.paused) {
            audio.play().catch(function(error) {
                console.log("Ошибка запуска: ", error);
            });
        }
    }, { once: true }); // once: true значит, что скрипт сработает только один раз
	
	const bgMusic = document.getElementById('bg-music');
    const allVideos = document.querySelectorAll('video');

    allVideos.forEach(video => {
        // Когда видео начинают смотреть
        video.onplay = () => {
            bgMusic.pause();
        };

        // Когда видео ставят на паузу или оно кончилось
        video.onpause = () => {
            // Проверяем, не играет ли в этот момент какое-то ДРУГОЕ видео
            const isAnyVideoPlaying = Array.from(allVideos).some(v => !v.paused);
            if (!isAnyVideoPlaying) {
                bgMusic.play();
            }
        };
    });
	
</script>
